
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Calculator</title>
    <script src="https://code.angularjs.org/1.6.9/angular.js"></script>
</head>
<body ng-app="CalculatorApp"
      ng-controller="CalculatorController">

    <h2>Simple Calculator</h2>

    <p>
        Number A:
        <input type="number" ng-model="a">
    </p>

    <p>
        Number B:
        <input type="number" ng-model="b">
    </p>

    <p>
        Operator:
        <select ng-model="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
    </p>

    <h3>Result: {{ result() }}</h3>

    <script>
        angular.module("CalculatorApp", [])
        .controller("CalculatorController", function($scope) {
            $scope.a = 0;
            $scope.b = 0;
            $scope.operator = "+";

            $scope.result = function() {
                var a = Number($scope.a) || 0;
                var b = Number($scope.b) || 0;

                if ($scope.operator === "+") {
                    return a + b;
                }

                if ($scope.operator === "-") {
                    return a - b;
                }

                if ($scope.operator === "*") {
                    return a * b;
                }

                if ($scope.operator === "/") {
                    return b === 0 ? "Cannot divide by zero" : a / b;
                }
            };
        });
    </script>

</body>
</html>
