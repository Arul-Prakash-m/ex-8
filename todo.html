
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <script src="https://code.angularjs.org/1.6.9/angular.js"></script>
</head>
<body ng-app="todoApp"
      ng-controller="todoController">

    <h2>Simple To-Do List</h2>

    <input type="text"
           ng-model="title"
           placeholder="Enter a task">

    <button ng-click="add()">Add</button>

    <h3>Tasks</h3>

    <ul>
        <li ng-repeat="t in tasks track by $index">
            {{ t }}
        </li>
    </ul>

    <script>
        angular.module("todoApp", [])
        .controller("todoController", function($scope) {
            $scope.tasks = [];

            $scope.add = function() {
                if ($scope.title &&
                    $scope.title.trim() !== "") {
                    $scope.tasks.push($scope.title.trim());
                    $scope.title = "";
                }
            };
        });
    </script>

</body>
</html>
