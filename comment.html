
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comment Box</title>
    <script src="https://code.angularjs.org/1.6.9/angular.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        textarea {
            width: 350px;
            height: 80px;
        }

        li {
            margin: 10px 0;
        }

        button {
            margin-top: 10px;
        }
    </style>
</head>
<body ng-app="commentApp">

<div ng-controller="FrmController">
    <h3>Post your Comment</h3>

    <textarea ng-model="txtcomment"
              placeholder="Your Comment"></textarea>
    <br>

    <button ng-click="btn_add()">Post Comment</button>

    <h4>Comments</h4>
    <ul>
        <li ng-repeat="comnt in comment track by $index">
            {{ comnt }}
            <button ng-click="remItem($index)">Remove</button>
        </li>
    </ul>
</div>

<script>
    angular.module("commentApp", [])
    .controller("FrmController", function($scope) {
        $scope.comment = [];

        $scope.btn_add = function() {
            if ($scope.txtcomment &&
                $scope.txtcomment.trim() !== "") {
                $scope.comment.push($scope.txtcomment.trim());
                $scope.txtcomment = "";
            }
        };

        $scope.remItem = function(index) {
            $scope.comment.splice(index, 1);
        };
    });
</script>

</body>
</html>
